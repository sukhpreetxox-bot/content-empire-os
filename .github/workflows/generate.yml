name: generate

# Generation cron — idea -> script -> editorial gate -> voiceover -> video
# -> writes rows with status 'review' for you to approve in the dashboard.
on:
  schedule:
    - cron: "0 7 * * *"     # daily 07:00 UTC → Shorts (reach)
    # deep long-form PAUSED (retention ~5% on a 0-sub channel — too early).
    # Re-enable once Shorts build retention + subs. Still runnable on demand
    # via workflow_dispatch with format=deep.
    # - cron: "0 6 * * 1,4"   # Mon & Thu 06:00 UTC → deep long-form (revenue)
  workflow_dispatch:
    inputs:
      platform:
        description: "Limit to one platform (youtube/instagram) or leave blank for all"
        required: false
        default: ""
      format:
        description: "short | deep  (long retired)"
        required: false
        default: "short"

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # deep long-form renders are heavy
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install ffmpeg + espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Cache Kokoro model
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-model-v1.0
      - name: Download Kokoro model
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en
      - name: Install Python deps
        run: pip install -r pipeline/requirements.txt
      - name: Fetch royalty-free music (CC BY, cached)
        run: python pipeline/tools/fetch_music.py || true
      - name: Install Remotion deps
        run: npm ci --prefix remotion || npm install --prefix remotion
      - name: Generate
        run: |
          # format: Mon/Thu schedule -> deep; other schedule -> short;
          # manual dispatch -> the chosen input.
          if [ "${{ github.event.schedule }}" = "0 6 * * 1,4" ]; then
            FMT=deep
          elif [ -n "${{ github.event.inputs.format }}" ]; then
            FMT="${{ github.event.inputs.format }}"
          else
            FMT=short
          fi
          echo "format=$FMT"
          python pipeline/gen_cron.py --platform youtube --format "$FMT"
