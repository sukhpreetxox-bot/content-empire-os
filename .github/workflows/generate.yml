name: generate

# Generation cron — idea -> script -> editorial gate -> voiceover -> video
# -> writes rows with status 'review' for you to approve in the dashboard.
on:
  schedule:
    - cron: "0 7 * * *"   # daily 07:00 UTC (best-effort timing on Actions)
  workflow_dispatch:
    inputs:
      platform:
        description: "Limit to one platform (youtube/instagram) or leave blank for all"
        required: false
        default: ""
      format:
        description: "long or short (YouTube Shorts)"
        required: false
        default: "long"

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install ffmpeg + espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Cache Kokoro model
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-model-v1.0
      - name: Download Kokoro model
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en
      - name: Install Python deps
        run: pip install -r pipeline/requirements.txt
      - name: Install Remotion deps
        run: npm ci --prefix remotion || npm install --prefix remotion
      - name: Generate
        run: |
          if [ -n "${{ github.event.inputs.platform }}" ]; then
            python pipeline/gen_cron.py --platform "${{ github.event.inputs.platform }}"
          else
            python pipeline/gen_cron.py
          fi
